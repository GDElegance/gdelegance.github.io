function renderProducts() {

  const container = document.getElementById("products");

  container.innerHTML = "";

  products.forEach((product, index) => {

    let imagesHTML = product.images.map(image =>
      `<img src="${image}" alt="${product.name}">`
    ).join("");

    let priceHTML;

    if (product.sale !== null) {
      priceHTML =
        `<div class="price">
          <span class="old-price">${product.price}$</span>
          <span class="sale">${product.sale}$ 🔥 SALE</span>
        </div>`;
    } else {
      priceHTML =
        `<div class="price">${product.price}$</div>`;
    }

    container.innerHTML += `

      <div class="product">

        <div class="photos">
          ${imagesHTML}
        </div>

        <h2>${product.name}</h2>

        ${product.description ? `<p class="description">${product.description}</p>` : ""}

        ${priceHTML}

        <div class="quantity">

          <button onclick="changeQuantity(${index}, -1)">−</button>

          <span id="qty${index}">0</span>

          <button onclick="changeQuantity(${index}, 1)">+</button>

        </div>

      </div>

    `;
  });
}

function changeQuantity(index, amount) {

  products[index].quantity += amount;

  if (products[index].quantity < 0) {
    products[index].quantity = 0;
  }

  document.getElementById("qty" + index).textContent =
    products[index].quantity;

  updateTotal();
}

function updateTotal() {

  let total = 0;

  products.forEach(product => {

    if (product.quantity > 0) {

      let price =
        product.sale !== null
          ? product.sale
          : product.price;

      total += price * product.quantity;
    }

  });

  const delivery =
    Number(document.getElementById("area").value);

  if (total > 0) {
    total += delivery;
  }

  document.getElementById("total").textContent =
    total.toFixed(2);
}

function sendOrder() {

  let message = "🛍️ طلب جديد من G&D Elegance\n\n";

  let hasOrder = false;
  let productsTotal = 0;

  products.forEach(product => {

    if (product.quantity > 0) {

      hasOrder = true;

      let price =
        product.sale !== null
          ? product.sale
          : product.price;

      let subtotal =
        price * product.quantity;

      productsTotal += subtotal;

      message +=
        "• " +
        product.name +
        " × " +
        product.quantity +
        " = " +
        subtotal.toFixed(2) +
        "$\n";
    }

  });

  if (!hasOrder) {

    alert("يرجى اختيار منتج واحد على الأقل");

    return;
  }

  const area =
    document.getElementById("area");

  const delivery =
    Number(area.value);

  const areaName =
    area.options[area.selectedIndex].text;

  const total =
    productsTotal + delivery;

  message +=
    "\n💵 مجموع المنتجات: " +
    productsTotal.toFixed(2) +
    "$";

  message +=
    "\n🚚 التوصيل: " +
    delivery.toFixed(2) +
    "$";

  message +=
    "\n📍 المنطقة: " +
    areaName;

  message +=
    "\n\n💰 المجموع النهائي: " +
    total.toFixed(2) +
    "$";

  const phone = "96176356614";

  const url =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(message);

  window.open(url, "_blank");
}
