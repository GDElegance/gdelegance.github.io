    body {

      padding: 15px;

    }

    h1 {

    }

    .product {

      padding: 15px;
      margin: 15px 0;
      border-radius: 15px;
      box-shadow: 0 2px 10px #ddd;
      text-align: center;
    }

    .photos {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      justify-content: center;
    }

    .photos img {
      width: 250px;
      height: 250px;
      object-fit: contain;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .product h2 {
      font-size: 20px;
      margin: 12px 0 8px;
    }

    .description {
      font-size: 14px;
      line-height: 1.7;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 10px;
    }

    .old-price {
      color: #888;
      text-decoration: line-through;
      margin-left: 8px;
    }

    .sale {
      color: #e60023;
      font-weight: bold;
    }

    .available {
      display: inline-block;
      background: #e8f8ed;
      color: #16833b;
      padding: 7px 12px;
      border-radius: 20px;
      font-weight: bold;
      margin: 5px;
    }

    .unavailable {
      display: inline-block;
      background: #ffe8e8;
      color: #d60000;
      padding: 9px 14px;
      border-radius: 20px;
      font-weight: bold;
      margin: 8px;
    }

    .quantity {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-top: 15px;
    }

    .quantity button {
      width: 45px;
      height: 42px;
      border: none;
      border-radius: 10px;
      font-size: 24px;
      cursor: pointer;
      background: #ddd;
    }

    .quantity button:disabled {
      background: #eee;
      color: #aaa;
      cursor: not-allowed;
    }

    .quantity span {
      font-size: 20px;
      font-weight: bold;
      min-width: 30px;
    }

    .checkout {
      background: white;
      padding: 20px;
      margin-top: 25px;
      border-radius: 15px;
      box-shadow: 0 2px 10px #ddd;
    }

    .checkout h2 {
      text-align: center;
    }

    select,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
      margin-top: 8px;
    }

    textarea {
      resize: vertical;
      font-family: Arial, sans-serif;
    }

    .total {
      font-size: 21px;
      font-weight: bold;
      margin: 20px 0;
      text-align: center;
    }

    #order {
      width: 100%;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>

// الكمية الافتراضية

  product.quantity = 0;

// عرض المنتجات
function renderProducts() {

  const container = document.getElementById("products");

  container.innerHTML = "";

  products.forEach((product, index) => {

    let imagesHTML = "";

    product.images.forEach(image => {

      imagesHTML += `
        <img
          src="${image}"
          alt="${product.name}"
        >
      `;

    });


    let priceHTML = "";

    if (product.sale !== null) {

      priceHTML = `
        <div class="price">
          <span class="old-price">
            ${product.price}$
          </span>

          <span class="sale">
            ${product.sale}$ 🔥 SALE
          </span>
        </div>
      `;

    } else {

      priceHTML = `
        <div class="price">
          ${product.price}$
        </div>
      `;

    }


    let availabilityHTML = "";

    if (product.available) {

      availabilityHTML = `
        <div class="available">
          🟢 متوفر
        </div>

        <div class="quantity">

          <button
            onclick="changeQuantity(${index}, -1)"
          >
            −
          </button>

          <span id="qty${index}">
            0
          </span>

          <button
            onclick="changeQuantity(${index}, 1)"
          >
            +
          </button>

        </div>
      `;

    } else {

      availabilityHTML = `
        <div class="unavailable">
          🔴 غير متوفر حاليًا — الكمية محدودة
        </div>
      `;

    }


    container.innerHTML += `

      <div class="product">

        <div class="photos">
          ${imagesHTML}
        </div>

        <h2>
          ${product.name}
        </h2>

        ${
          product.description
          ? `<p class="description">
               ${product.description}
             </p>`
          : ""
        }

        ${priceHTML}

        ${availabilityHTML}

      </div>

    `;

  });

}


// تغيير الكمية
function changeQuantity(index, amount) {

  if (!products[index].available) {
    return;
  }

  products[index].quantity += amount;

  if (products[index].quantity < 0) {
    products[index].quantity = 0;
  }

  document.getElementById(
    "qty" + index
  ).textContent =
    products[index].quantity;

  updateTotal();
}


// حساب المجموع
function updateTotal() {

  let productsTotal = 0;

  products.forEach(product => {

    if (
      product.available &&
      product.quantity > 0
    ) {

      const price =
        product.sale !== null
        ? product.sale
        : product.price;

      productsTotal +=
        price * product.quantity;
    }

  });


  const delivery =
    Number(
      document.getElementById("area").value
    );


  let total = productsTotal;


  if (productsTotal > 0) {
    total += delivery;
  }


  document.getElementById(
    "total"
  ).textContent =
    total.toFixed(2);
}


// إرسال الطلب
function sendOrder() {

  let message =
    "🛍️ طلب جديد من G&D Elegance\n\n";

  let hasOrder = false;

  let productsTotal = 0;


  products.forEach(product => {

    if (
      product.available &&
      product.quantity > 0
    ) {

      hasOrder = true;


      const price =
        product.sale !== null
        ? product.sale
        : product.price;


      const subtotal =
        price * product.quantity;


      productsTotal += subtotal;


      message +=
        "• " +
        product.name +
        " × " +
        product.quantity +
        " = " +
        subtotal.toFixed(2) +
        "$\n";

    }

  });


  if (!hasOrder) {

    alert(
      "يرجى اختيار منتج واحد على الأقل"
    );

    return;
  }


  const area =
    document.getElementById("area");


  const delivery =
    Number(area.value);


  const areaName =
    area.options[
      area.selectedIndex
    ].text;


  const address =
    document
      .getElementById("address")
      .value
      .trim();


  if (!address) {

    alert(
      "يرجى كتابة عنوان التوصيل بالتفصيل"
    );

    document
      .getElementById("address")
      .focus();

    return;
  }


  const total =
    productsTotal + delivery;


  message +=
    "\n💵 مجموع المنتجات: " +
    productsTotal.toFixed(2) +
    "$";


  message +=
    "\n🚚 الدليفري: " +
    delivery.toFixed(2) +
    "$";


  message +=
    "\n📍 القضاء: " +
    areaName;


  message +=
    "\n🏠 العنوان بالتفصيل: " +
    address;


  message +=
    "\n\n💰 المجموع النهائي: " +
    total.toFixed(2) +
    "$";


  const phone =
    "96176356614";


  const whatsappURL =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(message);


  window.open(
    whatsappURL,
    "_blank"
  );

}
