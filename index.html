<style>
*{box-sizing:border-box}
body{
margin:0;padding:15px;font-family:Arial,sans-serif;
background:#f8f4f6;color:#222
}
h1{text-align:center;margin:10px 0 25px}
.categories{
display:grid;grid-template-columns:repeat(2,1fr);
gap:12px;max-width:700px;margin:0 auto 25px
}
.category-btn{
border:none;border-radius:15px;padding:18px 10px;
background:white;box-shadow:0 2px 8px #ddd;
font-size:17px;font-weight:bold;cursor:pointer
}
.category-btn.active{background:#222;color:white}
.all-btn{grid-column:1/-1}
.category-title{text-align:center;margin:25px 0 15px;font-size:24px}
.product{
background:white;padding:15px;margin:15px auto;
max-width:700px;border-radius:16px;
box-shadow:0 2px 10px #ddd;text-align:center
}
.photos{
display:flex;gap:10px;overflow-x:auto;justify-content:center
}
.photos img{
width:250px;height:250px;object-fit:contain;
border-radius:12px;flex-shrink:0;background:#fff
}
.product h2{font-size:20px;margin:12px 0 8px}
.description{font-size:14px;line-height:1.8}
.price{font-size:20px;font-weight:bold;margin:12px}
.old-price{color:#888;text-decoration:line-through;margin-left:8px}
.sale{color:#e60023;font-weight:bold}
.available,.unavailable{
display:inline-block;padding:8px 14px;border-radius:20px;font-weight:bold
}
.available{background:#e8f8ed;color:#16833b}
.unavailable{background:#ffe7e7;color:#d00000}
.quantity{
display:flex;justify-content:center;align-items:center;
gap:18px;margin-top:15px
}
.quantity button{
width:45px;height:42px;border:none;border-radius:10px;
background:#ddd;font-size:24px;cursor:pointer
}
.quantity span{min-width:30px;font-size:20px;font-weight:bold}
.ask-price{
display:inline-block;margin-top:12px;padding:12px 20px;
border:none;border-radius:12px;background:#25D366;color:white;
font-size:16px;font-weight:bold;text-decoration:none
}
.gift-number{
font-size:18px;font-weight:bold;margin:10px 0
}
.checkout{
background:white;max-width:700px;margin:30px auto 10px;
padding:20px;border-radius:16px;box-shadow:0 2px 10px #ddd
}
.checkout h2{text-align:center}
select,textarea{
width:100%;padding:13px;border-radius:10px;
border:1px solid #ccc;font-size:16px;margin-top:8px
}
textarea{resize:vertical;font-family:Arial}
.total{text-align:center;font-size:21px;font-weight:bold;margin:20px 0}
#order{
width:100%;padding:16px;border:none;border-radius:12px;
background:#25D366;color:white;font-size:19px;font-weight:bold;
cursor:pointer
}
@media(max-width:500px){
.categories{grid-template-columns:1fr 1fr}
.category-btn{font-size:15px;padding:15px 5px}
.photos img{width:220px;height:220px}
}
</style>
</head>

window.open(
"https://wa.me/"+phone+
"?text="+encodeURIComponent(message),
"_blank"
);
}


function renderProducts(category="all"){

const container=document.getElementById("products");
container.innerHTML="";

const filtered=
category==="all"
?products
:products.filter(p=>p.category===category);

if(category!=="all"){
container.innerHTML+=`
<h2 class="category-title">
${categoryNames[category]}
</h2>`;
}


filtered.forEach(product=>{

const index=products.indexOf(product);

let imagesHTML="";

product.images.forEach(image=>{
imagesHTML+=`
<img src="${image}"
alt="${product.name}"
onerror="this.style.display='none'">`;
});


/* أفكار الهدايا: صور فقط + رقم + سؤال عن السعر */

if(product.gift){

container.innerHTML+=`

<div class="product">

<div class="photos">
${imagesHTML}
</div>

<div class="gift-number">
🎁 فكرة هدية رقم ${product.giftNumber}
</div>

<button class="ask-price"
onclick="askPrice(${product.giftNumber})">
💬 السؤال عن السعر
</button>

</div>`;

return;
}


let priceHTML="";

if(product.sale!==null){

priceHTML=`
<div class="price">
<span class="old-price">${product.price}$</span>
<span class="sale">${product.sale}$ 🔥 SALE</span>
</div>`;

}else{

priceHTML=`
<div class="price">${product.price}$</div>`;

}


let availabilityHTML="";

if(product.available){

availabilityHTML=`

<div class="available">
🟢 متوفر
</div>

<div class="quantity">

<button onclick="changeQuantity(${index},-1)">
−
</button>

<span id="qty${index}">
${product.quantity}
</span>

<button onclick="changeQuantity(${index},1)">
+
</button>

</div>`;

}else{

availabilityHTML=`
<div class="unavailable">
🔴 غير متوفر حاليًا
</div>`;

}


container.innerHTML+=`

<div class="product">

<div class="photos">
${imagesHTML}
</div>

<h2>${product.name}</h2>

${
product.description
?`<p class="description">${product.description}</p>`
:""
}

${priceHTML}

${availabilityHTML}

</div>`;

});

}


function changeQuantity(index,amount){

const product=products[index];

if(!product.available)return;

product.quantity+=amount;

if(product.quantity<0)
product.quantity=0;

const element=document.getElementById("qty"+index);

if(element)
element.textContent=product.quantity;

updateTotal();
}


function updateTotal(){

let productsTotal=0;

products.forEach(product=>{

if(product.available && product.quantity>0){

const price=
product.sale!==null
?product.sale
:product.price;

productsTotal+=price*product.quantity;

}

});


const delivery=
Number(document.getElementById("area").value);

let total=productsTotal;

if(productsTotal>0)
total+=delivery;

document.getElementById("total")
.textContent=total.toFixed(2);
}


function sendOrder(){

let message=
"🛍️ طلب جديد من G&D Elegance\n\n";

let hasOrder=false;
let productsTotal=0;


products.forEach(product=>{

if(product.available && product.quantity>0){

hasOrder=true;

const price=
product.sale!==null
?product.sale
:product.price;

const subtotal=
price*product.quantity;

productsTotal+=subtotal;

message+=
"• "+product.name+
" × "+product.quantity+
" = "+subtotal.toFixed(2)+"$\n";

}

});


if(!hasOrder){

alert("يرجى اختيار منتج واحد على الأقل");
return;

}


const area=document.getElementById("area");

const delivery=
Number(area.value);

const areaName=
area.options[area.selectedIndex].text;

const address=
document.getElementById("address")
.value.trim();


if(!address){

alert("يرجى كتابة عنوان التوصيل بالتفصيل");

document.getElementById("address").focus();

return;
}


const total=
productsTotal+delivery;


message+=
"\n💵 مجموع المنتجات: "+
productsTotal.toFixed(2)+"$";

message+=
"\n🚚 الدليفري: "+
delivery.toFixed(2)+"$";

message+=
"\n📍 القضاء: "+
areaName;

message+=
"\n🏠 العنوان بالتفصيل: "+
address;

message+=
"\n\n💰 المجموع النهائي: "+
total.toFixed(2)+"$";


const phone="96176365219";

const whatsappURL=
"https://wa.me/"+
phone+
"?text="+
encodeURIComponent(message);


window.open(whatsappURL,"_blank");
}


renderProducts("all");
updateTotal();

</script>

</body>
</html>
