<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G&D Elegance</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .product {
      background: white;
      padding: 15px;
      margin: 15px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ddd;
      text-align: center;
    }

    .product img {
      width: 100%;
      max-width: 300px;
      border-radius: 10px;
    }

    .product h2 {
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
    }

    .quantity {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 18px;
    }

    .plus, .minus {
      background: #ddd;
    }

    #order {
      width: 100%;
      background: #25D366;
      color: white;
      font-size: 20px;
      margin-top: 20px;
      padding: 15px;
    }
  </style>
</head>

<body>

  <h1>🛍️ G&D Elegance</h1>

  <div class="product">

    <img src="IMG-20260817-WA0086.jpg" alt="Essence Eyeliner">

    <h2>Essence Eyeliner Original 100%</h2>

    <p class="price">6$</p>

    <div class="quantity">
      <button class="minus" onclick="changeQuantity(-1)">−</button>
      <span id="qty">0</span>
      <button class="plus" onclick="changeQuantity(1)">+</button>
    </div>

  </div>

  <button id="order" onclick="sendOrder()">
    📱 إرسال الطلب عبر واتساب
  </button>

  <script>
    let quantity = 0;

    function changeQuantity(amount) {
      quantity += amount;

      if (quantity < 0) {
        quantity = 0;
      }

      document.getElementById("qty").textContent = quantity;
    }

    function sendOrder() {

      if (quantity === 0) {
        alert("يرجى اختيار الكمية أولاً");
        return;
      }

      let message =
        "🛍️ طلب جديد:%0A%0A" +
        "Essence Eyeliner Original 100%%0A" +
        "الكمية: " + quantity + "%0A" +
        "السعر: 6$%0A" +
        "المجموع: " + (quantity * 6) + "$";

      const phone = "96176356614";

      window.open(
        "https://wa.me/" + phone + "?text=" + message,
        "_blank"
      );
    }
  </script>

</body>
</html>
